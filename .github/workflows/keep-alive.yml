# F12: Supabase pauses a free project after about a week with too little
# database activity, and a paused project takes the site down until someone
# restores it in the dashboard. Twice a week this workflow opens the live
# search page (which reads the database) and asks each configured Supabase
# project for one public row. docs/SETUP.md section 8.10 explains the secrets.
name: Keep Supabase awake

on:
  schedule:
    # Monday and Thursday at 03:17 UTC (09:17 in Dhaka).
    - cron: "17 3 * * 1,4"
  # Lets the team run it by hand: Actions, Keep Supabase awake, Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://house-manager-rho-eight.vercel.app' }}
      DEV_URL: ${{ secrets.SUPABASE_DEV_URL }}
      DEV_KEY: ${{ secrets.SUPABASE_DEV_PUBLISHABLE_KEY }}
      DEMO_URL: ${{ secrets.SUPABASE_DEMO_URL }}
      DEMO_KEY: ${{ secrets.SUPABASE_DEMO_PUBLISHABLE_KEY }}
    steps:
      - name: Open the live search page
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE_URL/bn/ads")
          echo "Live site /bn/ads answered $code"
          test "$code" = "200"

      - name: Ask each Supabase project for one row
        run: |
          failed=0
          for name in DEV DEMO; do
            url_var="${name}_URL"; key_var="${name}_KEY"
            url="${!url_var}"; key="${!key_var}"
            if [ -z "$url" ] || [ -z "$key" ]; then
              echo "$name: no secrets set, skipped."
              continue
            fi
            # A publishable key is public (the site sends it to every browser);
            # it only reads what Row Level Security lets a visitor read.
            code=$(curl -s -o /tmp/row.json -w '%{http_code}' --max-time 60 \
              "${url%/}/rest/v1/divisions?select=id&limit=1" -H "apikey: $key")
            echo "$name: Supabase answered $code $(head -c 80 /tmp/row.json)"
            if [ "$code" != "200" ]; then failed=1; fi
          done
          exit $failed
